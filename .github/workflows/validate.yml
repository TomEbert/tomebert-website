name: Validate site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          page = Path("index.html")
          if not page.exists():
              raise SystemExit("index.html is missing")

          class Validator(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.html = False
                  self.body = False
                  self.script = 0
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  if tag == "html":
                      self.html = True
                  elif tag == "body":
                      self.body = True
                  elif tag == "script":
                      self.script += 1

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.script -= 1

          validator = Validator()
          validator.feed(page.read_text(encoding="utf-8"))

          if not validator.html or not validator.body:
              raise SystemExit("index.html is missing html or body")
          if validator.script != 0:
              raise SystemExit("Unbalanced script tags")
          if not Path("tom-ebert.webp").exists():
              raise SystemExit("tom-ebert.webp is missing")

          print("Site validation passed")
          PY

      - name: Check referenced assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          assets = re.findall(r'(?:src|href)="([^"]+)"', html)

          for asset in assets:
              if "://" in asset or asset.startswith("mailto:") or asset.startswith("#"):
                  continue
              if not Path(asset).exists():
                  raise SystemExit(f"Referenced asset is missing: {asset}")

          print("Asset references passed")
          PY
