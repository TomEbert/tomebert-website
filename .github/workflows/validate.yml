name: Validate site

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          page = Path("index.html")
          if not page.exists():
              raise SystemExit("index.html is missing")

          class Validator(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.html = False
                  self.body = False
                  self.script = 0
                  self.ids = set()
                  self.references = set()

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  element_id = attributes.get("id")
                  if element_id:
                      if element_id in self.ids:
                          raise SystemExit(f"Duplicate element ID: {element_id}")
                      self.ids.add(element_id)
                  for attribute in ("aria-controls", "aria-labelledby", "aria-describedby"):
                      self.references.update(attributes.get(attribute, "").split())
                  if tag == "html":
                      self.html = True
                  elif tag == "body":
                      self.body = True
                  elif tag == "script":
                      self.script += 1

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.script -= 1

          validator = Validator()
          validator.feed(page.read_text(encoding="utf-8"))

          if not validator.html or not validator.body:
              raise SystemExit("index.html is missing html or body")
          if validator.script != 0:
              raise SystemExit("Unbalanced script tags")

          missing_ids = validator.references - validator.ids
          if missing_ids:
              raise SystemExit(f"Unresolved accessibility references: {sorted(missing_ids)}")

          print("Site validation passed")
          PY

      - name: Check JavaScript syntax
        run: node --check assets/js/site.js

      - name: Check referenced assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          html = Path("index.html").read_text(encoding="utf-8")
          assets = re.findall(r'(?:src|href)="([^"]+)"', html)

          for asset in assets:
              url = urlsplit(asset)
              if url.scheme in ("https", "mailto") or asset.startswith("#"):
                  continue
              if url.scheme or url.netloc or not Path(url.path).is_file():
                  raise SystemExit(f"Referenced asset is missing: {asset}")

          for stylesheet in Path("assets/css").rglob("*.css"):
              css = stylesheet.read_text(encoding="utf-8")
              for url in re.findall(r'url\(\s*["\']?([^"\')]+)', css):
                  url = url.strip()
                  if "://" in url or url.startswith(("data:", "#")):
                      continue
                  if not (stylesheet.parent / url).is_file():
                      raise SystemExit(f"{stylesheet}: referenced asset is missing: {url}")

          print("Asset references passed")
          PY

      - name: Install locked browser-test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts

      - name: Test the site in Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8769 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8769/; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8769/
          npm --prefix ../tests test
