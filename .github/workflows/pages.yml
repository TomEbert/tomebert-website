name: Publish Pages and PR previews

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble production and previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p public
          git archive HEAD:site | tar -x -C public

          # Read same-repository PR files as static content. Never run code from a PR.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | [.number, .head.sha] | @tsv' > previews.tsv

          while IFS=$'\t' read -r number sha; do
            git fetch --no-tags --depth=1 origin "$sha"
            destination="public/pr-preview/pr-$number"
            mkdir -p "$destination"

            if git cat-file -e "$sha:site/index.html" 2>/dev/null; then
              git archive "$sha:site" | tar -x -C "$destination"
            else
              # Also support branches created before the site directory moved.
              git ls-tree -z --name-only "$sha" | while IFS= read -r -d '' file; do
                case "$file" in
                  *.html|*.css|*.js|*.svg|*.png|*.webp|*.ico)
                    git archive "$sha" -- "$file" | tar -x -C "$destination"
                    ;;
                esac
              done
            fi

            test -f "$destination/index.html"
          done < previews.tsv

          if find public -type l -print -quit | grep -q .; then
            echo "Symbolic links are not supported in Pages output."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
