name: Package PR preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preview contents
        run: |
          test -f site/index.html
          test -z "$(find site -type l -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: site/
          if-no-files-found: error
          retention-days: 7
      - name: Explain how to open the preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            printf '[Open temporary GitHub Pages preview](https://tomebert.github.io/tomebert-previews/pr-%s/)\n\n' "$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Download site-preview from this run and extract it. Serve the extracted directory on a local HTTP server.' >> "$GITHUB_STEP_SUMMARY"

  link:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add the temporary preview link once
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          marker='<!-- isolated-pages-preview -->'
          endpoint="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          existing=$(gh api --paginate "$endpoint" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- isolated-pages-preview -->"))) | .id')
          if [[ -z "$existing" ]]; then
            body=$(printf '%s\n[Temporäre Website-Vorschau](https://tomebert.github.io/tomebert-previews/pr-%s/) · Verfügbar nach dem nächsten Sync.' "$marker" "$PR_NUMBER")
            gh api --silent --method POST "$endpoint" -f body="$body"
          fi
