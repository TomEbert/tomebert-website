name: Package PR preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preview contents
        run: |
          test -f site/index.html
          test -z "$(find site -type l -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: site/
          if-no-files-found: error
          retention-days: 7
      - name: Explain how to open the preview
        run: |
          echo 'Download site-preview from this run and extract it. Serve the extracted directory on a local HTTP server.' >> "$GITHUB_STEP_SUMMARY"
